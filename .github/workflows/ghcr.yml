# Fork-only: builds the image and publishes it to GitHub Container Registry
# using the automatic GITHUB_TOKEN, so no secrets need to be configured.
name: Publish image to GHCR

on:
  push:
    branches:
      - main
      - feat/awards
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test ./... -timeout 300s

  publish:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sirmartin/koito
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KOITO_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
